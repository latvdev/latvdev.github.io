<!DOCTYPE html>
<html lang="lo">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ເວັບໂຫຼດໂປຼແກຼມຂອງຂະແໜງໄອທີ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Lao', sans-serif; }
  </style>
</head>

<body class="bg-slate-50 min-h-screen">
  <!-- Navbar -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">
          IT
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-800 leading-tight">ເວັບໂຫຼດໂປຼແກຼມ IT</h1>
          <p class="text-xs text-slate-500">ຂະແໜງໄອທີ (IT Department Software Download Portal)</p>
        </div>
      </div>
      <button onclick="logout()" 
        class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition border border-red-200">
        ອອກຈາກລະບົບ
      </button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header & Search -->
    <div class="mb-8 text-center max-w-2xl mx-auto">
      <h2 class="text-2xl font-bold text-slate-800 mb-2">ລາຍຊື່ໂປຼແກຼມທັງໝົດ</h2>
      <p class="text-slate-600 text-sm mb-6">ເລືອກ ແລະ ດາວໂຫຼດໂປຼແກຼມທີ່ต้องการได้จากรายการด้านล่าง</p>
      
      <!-- Search input -->
      <div class="relative">
        <input type="text" id="searchInput" placeholder="ຄົ້ນຫາໂປຼແກຼມ (Search software)..." 
          class="w-full px-5 py-3 pl-12 bg-white border border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-400 absolute left-4 top-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
    </div>

    <!-- Software Grid Container -->
    <div id="softwareContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Generated items will appear here -->
    </div>

    <!-- Empty Search Result Alert -->
    <div id="noResults" class="hidden text-center py-12 text-slate-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-slate-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      ບໍ່ພົບໂປຼແກຼມທີ່ທ່ານຄົ້ນຫາ
    </div>
  </main>
<script>
  
</script>
  <script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
    window.location.replace('login.html');
  }

    function logout() {
  sessionStorage.clear();
  window.location.replace('login.html');
}
  </script>
  <script src="js.js"></script>
</body>

</html>
